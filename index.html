<!DOCTYPE html>
<html>
<head>
    <title>AI Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="calculator">

        <h1>AI Calculator</h1>

        <div class="display">0</div>

       <div class="buttons">

    <button class="calc-button">C</button>
    <button class="calc-button">7</button>
    <button class="calc-button">8</button>
    <button class="calc-button">9</button>

    <button class="calc-button">/</button>
    <button class="calc-button">4</button>
    <button class="calc-button">5</button>
    <button class="calc-button">6</button>

    <button class="calc-button">*</button>
    <button class="calc-button">1</button>
    <button class="calc-button">2</button>
    <button class="calc-button">3</button>

    <button class="calc-button">-</button>
    <button class="calc-button">0</button>
    <button class="calc-button">.</button>
    <button class="calc-button">+</button>

    <button class="calc-button">=</button>

</div>

    <div class="ai-assistant">

    <h2>AI Math Assistant</h2>

    <p>Ask me a math question!</p>

    <input type="text" id="ai-question" placeholder="Example: What is 25% of 80?">

    <button id="ask-ai">Ask AI</button>

    <div id="ai-answer"></div>

</div>

</div>

    </div>
    
<script src="script.js"></script>

</body>
</html>
